<html>
  <head>
    <title>Embedding Model</title>
  </head>

  <body>
    <div x-data>
      <template x-if="$store.settings.settings">
        <div>
          <div class="section-title">Embedding Model</div>
          <div class="section-description">
            Settings for the embedding model used by the framework
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Embedding model provider</div>
              <div class="field-description">Select provider for embedding model used by the framework</div>
            </div>
            <div class="field-control">
              <select :value="$store.settings.settings.embed_model_provider"
                      @change="$store.settings.handleProviderChange('embed_model_provider', $event.target.value)">
                <template x-for="option in $store.settings.additional?.embedding_providers" :key="option.value">
                  <option :value="option.value" :selected="option.value === $store.settings.settings.embed_model_provider" x-text="option.label"></option>
                </template>
              </select>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Embedding model name</div>
              <div class="field-description">Exact name of model from selected provider</div>
            </div>
            <div class="field-control">
              <div class="model-name-wrapper"
                   x-data="{ showDropdown: false }"
                   @click.outside="showDropdown = false">
                <input type="text"
                       x-model="$store.settings.settings.embed_model_name"
                       @keydown.enter="$store.settings.saveModelName('embed_model_name')"
                       style="flex:1; padding-right:4.4em;" />
                <button type="button" title="Remove from history"
                        @click="$store.settings.removeFromModelHistory('embed_model_name', $store.settings.settings.embed_model_name)"
                        class="model-remove-btn">&minus;</button>
                <button type="button" aria-label="Toggle dropdown"
                        @click="showDropdown = !showDropdown"
                        class="model-dropdown-btn">&#x25BE;</button>
                <div x-show="showDropdown" x-transition class="model-dropdown">
                  <template x-for="name in $store.settings.getModelHistory('embed_model_name')" :key="name">
                    <div class="model-dropdown-item"
                         @click="$store.settings.selectModelName('embed_model_name', name); showDropdown = false"
                         x-text="name"></div>
                  </template>
                  <div x-show="$store.settings.getModelHistory('embed_model_name').length === 0"
                       class="model-dropdown-empty">No saved models</div>
                </div>
              </div>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">API key</div>
              <div class="field-description">API key for the selected embedding model provider</div>
            </div>
            <div class="field-control">
              <input
                type="text"
                x-model="$store.settings.settings.api_keys[$store.settings.settings.embed_model_provider]"
                autocomplete="off"
              />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Embedding model API base URL</div>
              <div class="field-description">
                API base URL for embedding model. Leave empty for default. Only relevant for Azure, local and custom (other) providers.
              </div>
            </div>
            <div class="field-control">
              <input type="text" x-model="$store.settings.settings.embed_model_api_base" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Requests per minute limit</div>
              <div class="field-description">
                Limits the number of requests per minute to the embedding model. Waits if the limit is exceeded. Set to 0 to disable rate limiting.
              </div>
            </div>
            <div class="field-control">
              <input type="number" x-model.number="$store.settings.settings.embed_model_rl_requests" />
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <div class="field-title">Input tokens per minute limit</div>
              <div class="field-description">
                Limits the number of input tokens per minute to the embedding model. Waits if the limit is exceeded. Set to 0 to disable rate limiting.
              </div>
            </div>
            <div class="field-control">
              <input type="number" x-model.number="$store.settings.settings.embed_model_rl_input" />
            </div>
          </div>

          <div class="field field-full">
            <div class="field-label">
              <div class="field-title">Embedding model additional parameters</div>
              <div class="field-description">
                Any other parameters supported by <a href='https://docs.litellm.ai/docs/set_keys' target='_blank'>LiteLLM</a>. Format is KEY=VALUE on individual lines, like .env file. Value can also contain JSON objects - when unquoted, it is treated as object, number etc., when quoted, it is treated as string.
              </div>
            </div>
            <div class="field-control">
              <textarea x-model="$store.settings.settings.embed_model_kwargs"></textarea>
            </div>
          </div>
        </div>
      </template>
    </div>
  </body>
</html>
