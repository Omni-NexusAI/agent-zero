name: a0-standard-custom

services:
  a0-standard:
    container_name: A0-standard
    build:
      context: ./docker/run
      dockerfile: Dockerfile
      args:
        # Default stays on pre-release tag; override with env as needed
        GIT_REF: ${GIT_REF:-v0.9.8-custom-pre-cpu}
        BUILD_VARIANT: standard
        RELEASE_CHANNEL: ${RELEASE_CHANNEL:-pre}
        PYTORCH_VARIANT: cpu
        CACHE_DATE: ${CACHE_DATE:-none}
    ports:
      - "8895:80"
    environment:
      - BUILD_VARIANT=standard
      - RELEASE_CHANNEL=${RELEASE_CHANNEL:-pre}
      - PYTORCH_VARIANT=cpu
      # When true, standard exposes the remote worker option + defaults
      - A0_ENABLE_REMOTE_TTS=${A0_ENABLE_REMOTE_TTS:-false}
    restart: unless-stopped

  kokoro-gpu-worker:
    profiles: ["worker"]
    container_name: Kokoro-GPU-worker-standard
    build:
      context: .
      dockerfile: docker/Dockerfile.kokoro
      args:
        CACHE_DATE: ${CACHE_DATE:-none}
    ports:
      - "8896:8891"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

