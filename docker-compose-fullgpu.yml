name: agentspine-fullgpu

services:
  a0-fullgpu:
    container_name: agentspine-fullgpu
    build:
      context: ./docker/run
      dockerfile: Dockerfile
      args:
        # Default stays on pre-release tag; override with env (e.g. GIT_REF=v0.9.9-gpu-pre)
        GIT_REF: ${GIT_REF:-v0.9.9-gpu-pre}
        BUILD_VARIANT: fullGPU
        RELEASE_CHANNEL: ${RELEASE_CHANNEL:-pre}
        PYTORCH_VARIANT: cuda
        CACHE_DATE: ${CACHE_DATE:-none}
    ports:
      - "8892:80"
    environment:
      - BUILD_VARIANT=fullGPU
      - RELEASE_CHANNEL=${RELEASE_CHANNEL:-pre}
      - PYTORCH_VARIANT=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
