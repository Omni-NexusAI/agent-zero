name: agentspine-fullgpu

services:
  a0-fullgpu:
    container_name: agentspine-fullgpu
    image: ghcr.io/omni-nexusai/agent-zero:${IMAGE_TAG:-v0.9.9-gpu-pre}
    ports:
      - "8892:80"
    environment:
      - BUILD_VARIANT=fullGPU
      - RELEASE_CHANNEL=${RELEASE_CHANNEL:-pre}
      - PYTORCH_VARIANT=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
