name: a0-fullgpu-custom

services:
  a0-fullgpu:
    container_name: A0-fullgpu
    # Default stays on pre-release tag; override with env (e.g. IMAGE_TAG=v0.9.8-custom-full-gpu)
    image: ghcr.io/omni-nexusai/agent-zero:${IMAGE_TAG:-v0.9.8-custom-pre-full-gpu}
    ports:
      - "8892:80"
    environment:
      - BUILD_VARIANT=fullGPU
      - RELEASE_CHANNEL=${RELEASE_CHANNEL:-pre}
      - PYTORCH_VARIANT=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
