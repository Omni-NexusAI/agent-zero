name: agentspine-99

x-agentspine-common: &agentspine-common
  environment:
    AGENTSPINE_RELEASE: "9.9"
    AGENTSPINE_IDENTITY_ENABLED: "true"
  restart: unless-stopped

services:
  standard:
    <<: *agentspine-common
    profiles: ["standard"]
    image: ${AGENTSPINE_STANDARD_IMAGE:-ghcr.io/omni-nexusai/agent-zero:v0.9.9-standard}
    container_name: agentspine-standard-v9.9
    environment:
      AGENTSPINE_RELEASE: "9.9"
      AGENTSPINE_IDENTITY_ENABLED: "true"
      BUILD_VARIANT: standard
      # This is inert until the user selects Remote GPU worker in Enhanced
      # Speech.  It lets this standard image join the Compose sidecar without
      # a rebuild or host-address routing.
      A0_TTS_KOKORO_REMOTE_URL: http://kokoro-worker:8891
      A0_ENABLE_REMOTE_TTS: "true"
    ports:
      - "${AGENTSPINE_STANDARD_PORT:-51099}:80"
    volumes:
      - agentspine_standard_usr:/a0/usr

  kokoro-worker:
    profiles: ["kokoro"]
    build:
      context: ../..
      dockerfile: docker/agentspine/Dockerfile.kokoro-worker
    image: local/agentspine-kokoro-worker:v0.9.9
    container_name: agentspine-kokoro-worker-v9.9
    environment:
      KOKORO_DEVICE: cuda:auto
    gpus: all
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8891/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      default:
        aliases:
          # Preserve saved configurations from pre-9.9 validation stacks while
          # making the Compose service name the primary endpoint.
          - kokoro-gpu-worker
          - agentspine-kokoro-gpu

  worker:
    <<: *agentspine-common
    profiles: ["kokoro"]
    image: ${AGENTSPINE_STANDARD_IMAGE:-ghcr.io/omni-nexusai/agent-zero:v0.9.9-standard}
    container_name: agentspine-worker-v9.9
    depends_on:
      kokoro-worker:
        condition: service_healthy
    environment:
      AGENTSPINE_RELEASE: "9.9"
      AGENTSPINE_IDENTITY_ENABLED: "true"
      BUILD_VARIANT: standard
      A0_TTS_KOKORO_REMOTE_URL: http://kokoro-worker:8891
      A0_ENABLE_REMOTE_TTS: "true"
    ports:
      - "${AGENTSPINE_WORKER_PORT:-51100}:80"
    volumes:
      - agentspine_worker_usr:/a0/usr

  cuda:
    <<: *agentspine-common
    profiles: ["cuda"]
    build:
      context: ../..
      dockerfile: DockerfileAgentSpine99
      target: cuda
    image: local/agentspine:v0.9.9-cuda
    container_name: agentspine-cuda-v9.9
    environment:
      AGENTSPINE_RELEASE: "9.9"
      AGENTSPINE_IDENTITY_ENABLED: "true"
      BUILD_VARIANT: cuda
      PYTORCH_VARIANT: cuda
      A0_TTS_KOKORO_DEVICE: cuda
    gpus: all
    ports:
      - "${AGENTSPINE_CUDA_PORT:-51101}:80"
    volumes:
      - agentspine_cuda_usr:/a0/usr

volumes:
  agentspine_standard_usr:
  agentspine_worker_usr:
  agentspine_cuda_usr:
