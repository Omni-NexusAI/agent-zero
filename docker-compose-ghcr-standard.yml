name: a0-standard-custom

services:
  a0-standard:
    container_name: A0-standard
    # Default stays on pre-release CPU image; override with env (e.g. IMAGE_TAG=v0.9.8-custom-standard)
    image: ghcr.io/omni-nexusai/agent-zero:${IMAGE_TAG:-v0.9.8-custom-pre-cpu}
    ports:
      - "8895:80"
    environment:
      - BUILD_VARIANT=standard
      - RELEASE_CHANNEL=${RELEASE_CHANNEL:-pre}
      - PYTORCH_VARIANT=cpu
      - A0_ENABLE_REMOTE_TTS=${A0_ENABLE_REMOTE_TTS:-false}
    restart: unless-stopped

  kokoro-gpu-worker:
    profiles: ["worker"]
    container_name: Kokoro-GPU-worker-standard
    image: ghcr.io/omni-nexusai/agent-zero-kokoro-worker:${WORKER_IMAGE_TAG:-v0.9.8-custom-pre}
    ports:
      - "8896:8891"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

