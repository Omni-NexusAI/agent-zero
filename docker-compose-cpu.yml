name: agentspine-standard

services:
  a0-cpu:
    container_name: agentspine-standard-cpu-compat
    build:
      context: ./docker/run
      dockerfile: Dockerfile
      args:
        # Default stays on pre-release tag; override with env as needed
        GIT_REF: ${GIT_REF:-v0.9.9-standard-pre}
        BUILD_VARIANT: standard
        RELEASE_CHANNEL: ${RELEASE_CHANNEL:-pre}
        PYTORCH_VARIANT: cpu
        CACHE_DATE: ${CACHE_DATE:-none}
    ports:
      - "8891:80"
    environment:
      - BUILD_VARIANT=standard
      - RELEASE_CHANNEL=${RELEASE_CHANNEL:-pre}
      - PYTORCH_VARIANT=cpu
    restart: unless-stopped
